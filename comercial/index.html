<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daevid.com.ar | Perfil Comercial</title>
    <!-- Mismos estilos base -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --neon-green: #00ff41;
            --neon-blue: #007acc;
            --text-main: #c9d1d9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif; /* Usamos Inter para que sea más comercial */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #161b22 0%, #0d1117 100%);
        }

        .coming-soon-container {
            text-align: center;
            padding: 40px;
            background: rgba(22, 27, 34, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .highlight {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
        }

        p {
            font-size: 1.1rem;
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-back {
            display: inline-block;
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 12px 24px;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-family: 'Fira Code', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-back:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.6);
        }
        
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="scanlines"></div>
    <div class="coming-soon-container">
        <h1>Perfil <span class="highlight">Comercial</span></h1>
        <p>Estamos construyendo una experiencia adaptada para clientes comerciales y agencias. Por el momento, te invito a explorar mi portfolio técnico completo o contactarme directamente.</p>
        <a href="../tecnico/" class="btn-back">Volver al Perfil Técnico</a>
    </div>
</body>

</html>
