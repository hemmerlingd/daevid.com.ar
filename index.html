<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Daevid.com.ar | Full Stack Dev</title>
    <link rel="stylesheet" href="style.css?v=2">
    <!-- Fuente Monospace tipo VS Code -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&display=swap" rel="stylesheet">
    <!-- Marked.js para parsear Markdown a HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="vscode-theme">
    <!-- Pantalla de Inicio Animada -->
    <div id="intro-landing" class="intro-landing">
        <div class="landing-content">
            <h1 class="glitch-title" data-text="Daevid Hemmerling">Daevid Hemmerling</h1>
            <p class="landing-subtitle">Software & Web Developer</p>
            <div class="landing-buttons">
                <a href="comercial/" class="btn-landing btn-comercial">Ver perfil comercial</a>
                <button id="btn-tecnico" class="btn-landing btn-tecnico">Ver perfil técnico</button>
            </div>
        </div>
        <div class="landing-bg-elements"></div>
    </div>

    <div class="scanlines"></div>

    <script>
        // Animación de los botones para navegar
        document.getElementById('btn-tecnico').addEventListener('click', () => {
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = 'tecnico/';
            }, 500);
        });
        
        // Estilo adicional de transición para el body
        document.body.style.transition = 'opacity 0.5s ease';
    </script>
</body>

</html>
